name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Verify toolchain and runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          xcodebuild -version
          swift --version
          test "$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)" -ge 26

      - name: Run tests
        run: swift test --triple arm64-apple-macosx26.0

      - name: Build release archive
        shell: bash
        run: |
          set -euo pipefail
          export DEVELOPER_DIR="$(xcode-select -p)"
          tools/package-release.sh
          (cd dist && shasum -a 256 Mousse.zip > Mousse.zip.sha256)

      - name: Validate release archive
        shell: bash
        run: |
          set -euo pipefail
          check_dir="$(mktemp -d)"
          check_dir="$(cd "$check_dir" && pwd -P)"
          trap 'rm -rf "$check_dir"' EXIT
          ditto -x -k dist/Mousse.zip "$check_dir"
          test -d "$check_dir/Mousse.app/Contents/Resources/Mousse_Mousse.bundle"
          test "$(lipo -archs "$check_dir/Mousse.app/Contents/MacOS/Mousse")" = "arm64"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$check_dir/Mousse.app/Contents/Info.plist")" = "26.0"
          otool -l "$check_dir/Mousse.app/Contents/MacOS/Mousse" | grep -A 3 LC_BUILD_VERSION | grep -q "minos 26.0"
          codesign --verify --deep --strict --verbose=2 "$check_dir/Mousse.app"

          app_executable="$check_dir/Mousse.app/Contents/MacOS/Mousse"
          app_log="$check_dir/launch.log"
          "$app_executable" >"$app_log" 2>&1 &
          app_pid=$!
          sleep 2
          if kill -0 "$app_pid" 2>/dev/null; then
            kill "$app_pid"
            wait "$app_pid" 2>/dev/null || true
          else
            wait "$app_pid"
          fi
          ! grep -q "could not load resource bundle" "$app_log"

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: Mousse-${{ github.sha }}-macOS26-arm64
          path: |
            dist/Mousse.zip
            dist/Mousse.zip.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download validated release archive
        uses: actions/download-artifact@v7
        with:
          name: Mousse-${{ github.sha }}-macOS26-arm64
          path: dist

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/Mousse.zip dist/Mousse.zip.sha256 --clobber
          else
            gh release create "$tag" dist/Mousse.zip dist/Mousse.zip.sha256 \
              --title "$tag" --generate-notes
          fi
