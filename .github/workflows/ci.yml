name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Verify toolchain and runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          xcodebuild -version
          swift --version
          test "$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)" -ge 26

      - name: Run tests
        run: swift test --sdk "$(xcrun --sdk macosx --show-sdk-path)" --triple arm64-apple-macosx14.0

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          export DEVELOPER_DIR="$(xcode-select -p)"
          tools/package-release.sh
          version="$(awk -F'"' '/^VERSION=/ {print $2; exit}' build-app.sh)"
          mkdir -p dist
          cp "build/Mousse-${version}-arm64.zip" dist/Mousse-arm64.zip
          cp "build/Mousse-${version}-x86_64.zip" dist/Mousse-x86_64.zip
          (cd dist && shasum -a 256 Mousse-arm64.zip Mousse-x86_64.zip > SHA256SUMS)

      - name: Validate release archives
        shell: bash
        run: |
          set -euo pipefail
          check_root="$(mktemp -d)"
          check_root="$(cd "$check_root" && pwd -P)"
          trap 'rm -rf "$check_root"' EXIT
          for arch in arm64 x86_64; do
            check_dir="$check_root/$arch"
            mkdir -p "$check_dir"
            ditto -x -k "dist/Mousse-${arch}.zip" "$check_dir"
            app="$check_dir/Mousse.app"
            test -d "$app/Contents/Resources/Mousse_Mousse.bundle"
            test "$(lipo -archs "$app/Contents/MacOS/Mousse")" = "$arch"
            test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")" = "14.0"
            otool -l "$app/Contents/MacOS/Mousse" | grep -A 3 LC_BUILD_VERSION | grep -q "minos 14.0"
            codesign --verify --deep --strict --verbose=2 "$app"
          done

          # Only the runner's own architecture is launched; the x86_64 slice would need Rosetta.
          app_executable="$check_root/arm64/Mousse.app/Contents/MacOS/Mousse"
          app_log="$check_root/launch.log"
          "$app_executable" >"$app_log" 2>&1 &
          app_pid=$!
          sleep 2
          if kill -0 "$app_pid" 2>/dev/null; then
            kill "$app_pid"
            wait "$app_pid" 2>/dev/null || true
          else
            wait "$app_pid"
          fi
          ! grep -q "could not load resource bundle" "$app_log"

      - name: Upload release archives
        uses: actions/upload-artifact@v7
        with:
          name: Mousse-${{ github.sha }}-macOS14-multiarch
          path: |
            dist/Mousse-arm64.zip
            dist/Mousse-x86_64.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download validated release archives
        uses: actions/download-artifact@v7
        with:
          name: Mousse-${{ github.sha }}-macOS14-multiarch
          path: dist

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/Mousse-arm64.zip dist/Mousse-x86_64.zip dist/SHA256SUMS --clobber
          else
            gh release create "$tag" dist/Mousse-arm64.zip dist/Mousse-x86_64.zip dist/SHA256SUMS \
              --title "$tag" --generate-notes
          fi
